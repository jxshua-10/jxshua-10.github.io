<!DOCTYPE html>
    <html lang="es">
        <head>
            <meta charset="UTF-8">
            <title>Reservaciones</title>
            <link rel="stylesheet" href="estilos.css">
        </head>

        <body>

          <header>
            <h1>Sabor Cuscatleco</h1>
             <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="pagina1.html">Menú</a></li>
                    <li><a href="pagina2.html">Reservaciones</a></li>
                    <li><a href="servicios.html">Contacto</a></li>
                    <li><a href="inicio.html">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </header>


        <main>

            <section class="reserva">
                <h2>Haz tu reservación</h2>


                <form action="confirmacion.html" method="post">
                    <label>Nombre:</label>
                    <input type="text" placeholder="Escribe tu nombre" required>

                    <label>Fecha:</label>
                    <input type="date" required>

                    <label>Hora:</label>
                    <input type="time" required>

                    <label>Número de personas:</label>
                    <input type="number" placeholder="Cantidad" required>
                    <label>Zona de preferencia:</label>
                    <select name="zona" required>
                        <option value="">Selecciona una zona</option>
                        <option value="terraza">Terraza</option>
                        <option value="interior">Interior aire acondicionado</option>
                        <option value="jardin">Jardín</option>
                    </select>
                    <br>
                    <button type="submit" class="boton">Reservar</button>

                </form>
            </section>

        </main>

        <footer>
            <p>© 2026 Sabor Cuscatleco Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
